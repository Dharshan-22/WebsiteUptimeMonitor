server.port=8080
spring.application.name=WebsiteUptimeMonitor

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ── MySQL Database ───────────────────────────────────────────────────────────
# Configure database credentials via environment variables:
#   DB_USERNAME (e.g., root)
#   DB_PASSWORD (your MySQL password)
#
# The database "uptime_monitor" must already exist before starting the app.
# Run the schema.sql script in MySQL Workbench first (see README).

spring.datasource.url=jdbc:mysql://localhost:3306/uptime_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (Spring Boot default)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ── Schema initialisation ────────────────────────────────────────────────────
# Spring Boot will run src/main/resources/schema.sql automatically on startup.
# Set this to "never" after the tables exist to skip re-creation on every start.
spring.sql.init.mode=always
